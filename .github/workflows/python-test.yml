name: Python Test

on:
  pull_request:
    paths:
    - 'scripts/src/**'

jobs:
  enforce:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python
      id: setup-python
      uses: ./.github/actions/setup-python
    - name: Install CI scripts
      uses: ./.github/actions/install-ci-scripts
      with:
        python-version: ${{ steps.setup-python.outputs.python-version }}
    - name: Run pytest
      # Run everything under scripts/src by default, so a new test file is picked
      # up automatically. The previous allowlist meant tests were silently never
      # run unless someone remembered to widen it here.
      # chartprreview_test.py is excluded because it is already failing on main:
      # it calls verify_user() and check_owners_file_against_directory_structure()
      # with a signature that no longer exists. That predates this workflow change
      # and is tracked separately.
      run: |
        ./ve1/bin/pytest scripts/src/ --ignore=scripts/src/chartprreview
